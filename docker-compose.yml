services:
  backend:
    build:
      context: ./backend
    container_name: knowledge-agent-backend
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env.example

  frontend:
    build:
      context: ./frontend
    container_name: knowledge-agent-frontend
    ports:
      - "5173:80"
    depends_on:
      - backend
